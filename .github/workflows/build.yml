name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Mi-TV-Remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mi-TV-Remote
          path: Mi-TV-Remote.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mi TV Remote (latest build)
          body: |
            Download **Mi-TV-Remote.apk** below on your Android phone and open it to install.
            Built from commit ${{ github.sha }}.
          files: Mi-TV-Remote.apk
          make_latest: true
